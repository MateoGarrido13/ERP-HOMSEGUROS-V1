services:
  db:
    image: postgres:16-alpine
    container_name: hom-pas-postgres
    environment:
      POSTGRES_USER: hom
      POSTGRES_PASSWORD: hom
      POSTGRES_DB: hom_pas
    ports:
      - "5433:5432"
    volumes:
      - hom_pas_pg:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hom -d hom_pas"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  hom_pas_pg:
